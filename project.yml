name: OrzuApp
options:
  bundleIdPrefix: com.orzuapp
  # Строки в коде — на русском, переводы (tg, en) — в Localizable.xcstrings и InfoPlist.xcstrings.
  developmentLanguage: ru
packages:
  # Swift-пакет — stasel/WebRTC (сборки Google WebRTC). stasel/WebRTC-iOS — демо-приложение автора, тегов там нет.
  # Каждый релиз WebRTC — новая мажорная версия, поэтому from: "120.0.0" резолвится только в 120.x:
  # код звонков написан под M120. Переход на свежую версию — отдельной задачей со сборкой и проверкой звонков.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "120.0.0"
  # Вход через Google: официальный SDK (окно входа, PKCE, получение ID-токена).
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  OrzuApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - OrzuApp
    dependencies:
      - package: WebRTC
        product: WebRTC
      - package: GoogleSignIn
        product: GoogleSignIn
      # Расширение уведомлений встраивается в приложение (Embed Foundation Extensions).
      - target: OrzuNotificationService
    settings:
      base:
        # Google Cloud Console → Credentials → OAuth client ID типа iOS (bundle id com.orzuapp.messenger).
        # REVERSED — тот же id задом наперёд («com.googleusercontent.apps.…»): схема, по которой Google возвращает в приложение.
        # Пусто — кнопка «Войти через Google» не показывается. Этот же client ID нужен backend в GOOGLE_CLIENT_IDS.
        GOOGLE_IOS_CLIENT_ID: "31212846367-44um91131fsrkau3cf43i5pj4lpge16k.apps.googleusercontent.com"
        GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.31212846367-44um91131fsrkau3cf43i5pj4lpge16k"
        PRODUCT_BUNDLE_IDENTIFIER: com.orzuapp.messenger
        # Assets.xcassets: фирменный гранатовый цвет (кнопки, пузыри сообщений) и иконка 1024×1024 со светлым и тёмным вариантом.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: OrzuApp
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Бо Хам"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # На iPad система требует все ориентации (многозадачность), иначе — предупреждение сборки.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Микрофон/камера — для звонков, голосовых и видеосообщений.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Нужен доступ к микрофону для звонков, голосовых и видеосообщений"
        INFOPLIST_KEY_NSCameraUsageDescription: "Нужен доступ к камере для видеозвонков, видеосообщений и селфи для проверки анкеты"
        # Блокировка приложения (Настройки → Приложение): Face ID, а если не узнал — код-пароль телефона.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID нужен, чтобы открывать заблокированное приложение"
        # Знакомства: расстояние до анкет в ленте и геопозиция в тревоге SOS. Только когда приложение открыто.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Геопозиция нужна, чтобы показывать расстояние до анкет и отправить её доверенным контактам по SOS"
        # Фото и видео для анкеты выбираются системным пикером (PhotosPicker) — доступ ко всей библиотеке не нужен.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Доступ к фото нужен, чтобы добавить фото и видео в анкету и отправить их в чат"
    # voip — PushKit будит приложение ради входящего звонка (CallKit), audio — звук звонка при заблокированном экране,
    # remote-notification — доставка обычных push, fetch — фоновое обновление (BackgroundRefresh в OrzuAppApp.swift,
    # id его задачи — в BGTaskSchedulerPermittedIdentifiers). Остальные ключи Info.plist генерирует Xcode (GENERATE_INFOPLIST_FILE).
    info:
      path: OrzuApp/Info.plist
      properties:
        UIBackgroundModes: [voip, audio, remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.orzuapp.messenger.refresh]
        # Фирменные шрифты (SIL OFL, лицензии рядом): Unbounded — заголовки, Onest — текст.
        UIAppFonts:
          - Unbounded-Medium.ttf
          - Unbounded-SemiBold.ttf
          - Unbounded-Bold.ttf
          - Onest-Regular.ttf
          - Onest-Medium.ttf
          - Onest-SemiBold.ttf
          - Onest-Bold.ttf
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        # Второй — ссылки boham://u/<username> и boham://c/<username> (то же, что Universal Links, без сайта).
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
          - CFBundleURLSchemes: [boham]
        # Префикс команды для общей группы Keychain (см. SharedE2EStore): его знает только сборка.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
    # Push на реальном устройстве требует платный Apple Developer-аккаунт; для Симулятора подпись не проверяется.
    entitlements:
      path: OrzuApp/OrzuApp.entitlements
      properties:
        aps-environment: development
        # «Войти через Apple»: обязателен, раз есть вход через Google (App Store Review Guideline 4.8).
        com.apple.developer.applesignin: [Default]
        # Universal Links: https://adm.orzu.pro/u/… и /c/… открывают приложение. Сервер отдаёт /.well-known/apple-app-site-association.
        com.apple.developer.associated-domains: ["applinks:adm.orzu.pro"]
        # Общие с расширением уведомлений: id вошедшего и ключи собеседников (App Group), приватный ключ (Keychain).
        com.apple.security.application-groups: [group.com.orzuapp.messenger]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.orzuapp.messenger.shared"]
        # Рулетка: iPhone сам скрывает откровенное видео собеседника (SensitiveContentAnalysis, iOS 26+).
        com.apple.developer.sensitivecontentanalysis.client: [analysis]
    # AppConfig.apiBaseURL указывает на https-домен с валидным сертификатом, а ATS не блокирует
    # http://localhost для отладки через SSH-туннель — исключение здесь не нужно. Если решите
    # открыть backend по обычному http на внешнем IP/домене без TLS, верните сюда
    # info.properties.NSAppTransportSecurity.NSAllowsArbitraryLoads: true.
  # Правит push до показа: расшифровывает превью секретных чатов и прикрепляет миниатюру фото (сервер ставит mutable-content).
  OrzuNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - OrzuNotificationService
      # Общий с приложением код: схема шифрования, хранилище ключей и адрес сервера.
      - path: OrzuApp/E2E/SecretChatCrypto.swift
      - path: OrzuApp/E2E/SharedE2EStore.swift
      - path: OrzuApp/Networking/AppConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orzuapp.messenger.NotificationService
        PRODUCT_NAME: OrzuNotificationService
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Бо Хам"
    info:
      path: OrzuNotificationService/Info.plist
      properties:
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: OrzuNotificationService/OrzuNotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.com.orzuapp.messenger]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.orzuapp.messenger.shared"]
  # Unit-тесты чистой логики (декодирование, шифрование E2E) — запускаются в Симуляторе, в том числе в CI.
  OrzuAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - OrzuAppTests
    dependencies:
      - target: OrzuApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
schemes:
  OrzuApp:
    build:
      targets:
        OrzuApp: all
    test:
      targets:
        - OrzuAppTests
      # Тесты сверяют русские строки: на симуляторе с английским языком String(localized:) вернул бы перевод.
      language: ru
      region: RU
